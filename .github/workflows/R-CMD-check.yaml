name: R CMD check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-package:
    name: Build canonical source package
    runs-on: ubuntu-latest
    env:
      _R_CHECK_CRAN_INCOMING_REMOTE_: false
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: github::tkcaccia/faissR@7a22de471eb6d83dd9d1873ef0f89401ea8f11f5
          needs: check
      - name: Enforce source style
        run: Rscript tools/check_source_style.R
      - name: Test CUDA configure discovery and strict mode
        run: bash .github/scripts/test-configure-cuda.sh
      - name: Build source package
        run: R CMD build . --compact-vignettes=gs+qpdf
      - name: Archive source package
        uses: actions/upload-artifact@v7
        with:
          name: fastEmbedR-source-${{ github.sha }}
          path: fastEmbedR_*.tar.gz
          if-no-files-found: error
          retention-days: 14

  R-CMD-check:
    name: ${{ matrix.config.os }} / R ${{ matrix.config.r }} (CPU build)
    needs: source-package
    runs-on: ${{ matrix.config.os }}
    env:
      # CRAN's remote incoming lookup is an external network probe. Keep all
      # local --as-cran checks, but do not turn repository outages into package
      # warnings.
      _R_CHECK_CRAN_INCOMING_REMOTE_: false
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: release }
          - { os: ubuntu-latest, r: devel }
          - { os: macos-latest, r: release }
          - { os: windows-latest, r: release }
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Prepare macOS OpenMP for faissR
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          omp_prefix="$RUNNER_TEMP/faissr-libomp"
          mkdir -p "$omp_prefix/lib"
          ln -s "$(brew --prefix libomp)/include" "$omp_prefix/include"
          ln -s "$(R RHOME)/lib/libomp.dylib" "$omp_prefix/lib/libomp.dylib"
          echo "LIBOMP_HOME=$omp_prefix" >> "$GITHUB_ENV"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            github::tkcaccia/faissR@7a22de471eb6d83dd9d1873ef0f89401ea8f11f5
            any::rcmdcheck
          needs: check
      - name: Download canonical source package
        uses: actions/download-artifact@v8
        with:
          name: fastEmbedR-source-${{ github.sha }}
          path: source-package
      - name: Validate hardware-test drivers
        run: |
          bash -n .github/scripts/run-hardware-validation.sh
          Rscript -e 'parse(file = ".github/scripts/validate-hardware.R")'
      - name: Check
        shell: Rscript {0}
        run: |
          tarballs <- list.files(
            "source-package",
            pattern = "[.]tar[.]gz$",
            full.names = TRUE
          )
          stopifnot(length(tarballs) == 1L)
          rcmdcheck::rcmdcheck(
            tarballs[[1L]],
            args = c("--no-manual", "--as-cran"),
            error_on = "warning"
          )
