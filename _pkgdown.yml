url: https://tkcaccia.github.io/fastEmbedR/
destination: _site

template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [github]

home:
  title: fastEmbedR
  description: >-
    Native UMAP and interpolation-based t-SNE from data or precomputed
    nearest neighbors.

articles:
  - title: Start Here
    navbar: ~
    contents:
      - getting-started

reference:
  - title: t-SNE Embeddings
    desc: Native interpolation-based t-SNE, transform, and landmark workflows.
    contents:
      - tsne
      - tsne_knn
      - prepare_tsne_knn
      - transform_tsne
  - title: UMAP Embeddings
    desc: Native UMAP embedding from data or precomputed nearest neighbors.
    contents:
      - umap
      - umap_knn
      - prepare_umap_knn
  - title: Initialization
    desc: Construct package-native PCA and UMAP initializations.
    contents:
      - pca
      - umap_init
  - title: Nearest-Neighbor Precomputation
    desc: Build reusable reference and query neighbor structures.
    contents:
      - precompute_knn
      - precompute_query_knn
  - title: Landmark Utilities
    desc: Select landmarks and project valid landmark models.
    contents:
      - select_landmarks
      - project_landmark_model
  - title: Graph Utilities
    desc: Construct and cluster graphs derived from data or embeddings.
    contents:
      - knn_graph
      - graph_cluster
  - title: Quality Metrics
    desc: Score local preservation, labels, and global structure.
    contents:
      - evaluate_embedding
  - title: Object Methods
    desc: Print and plot package result objects.
    contents:
      - plot.fastEmbedR_embedding
      - print.fastEmbedR_embedding
      - print.fastEmbedR_graph
      - print.fastEmbedR_graph_cluster
      - print.fastEmbedR_umap_initialization
