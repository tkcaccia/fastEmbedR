url: https://tkcaccia.github.io/fastEmbedR/
destination: _site

template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [github]

home:
  title: fastEmbedR
  description: >-
    Native UMAP and interpolation-based t-SNE from data or precomputed
    nearest neighbors.

articles:
  - title: Start Here
    navbar: ~
    contents:
      - getting-started
      - massive-data

reference:
  - title: t-SNE Embeddings
    desc: Native interpolation-based t-SNE, transform, and landmark workflows.
    contents:
      - tsne
      - tsne_knn
      - prepare_tsne_knn
      - transform_tsne
  - title: UMAP Embeddings
    desc: Native UMAP embedding from data or precomputed nearest neighbors.
    contents:
      - umap
      - umap_knn
      - prepare_umap_knn
  - title: Initialization
    desc: Construct package-native PCA and UMAP initializations.
    contents:
      - pca
      - umap_init
  - title: Nearest-Neighbor Precomputation
    desc: Build reusable reference and query neighbor structures.
    contents:
      - precompute_knn
      - precompute_query_knn
  - title: Landmark Utilities
    desc: Select landmarks and project valid landmark models.
    contents:
      - select_landmarks
      - project_landmark_model
  - title: Graph Utilities
    desc: Construct and cluster graphs derived from data or embeddings.
    contents:
      - knn_graph
      - graph_cluster
  - title: Quality Metrics
    desc: Score local preservation, labels, and global structure.
    contents:
      - evaluate_embedding
  - title: Massive Matrices and PCA
    desc: File-backed data access and streamed principal components.
    contents:
      - massive_matrix
      - massive_read_rows
      - massive_open_pca
  - title: Massive Neighbors and Postings
    desc: Disk-backed nearest-neighbor construction and inspection.
    contents:
      - massive_coarse_postings
      - massive_open_postings
      - massive_read_posting
      - massive_search_postings
      - massive_posting_recall_pilot
      - massive_select_landmarks
      - massive_landmark_knn
      - massive_audit_landmark_knn
      - massive_read_knn_rows
      - massive_knn_graph
      - massive_full_knn_graph
      - massive_read_graph_edges
  - title: Massive Embeddings
    desc: File-backed graph, affinity, optimizer, and projection stages.
    contents:
      - massive_umap_memberships
      - massive_umap_fuzzy_graph
      - massive_fuzzy_graph
      - massive_affinity_graph
      - massive_tsne_affinities
      - massive_tsne_optimize
      - massive_umap_optimize
      - massive_project_landmarks
      - massive_open_projection
  - title: Massive Graphs and Clustering
    desc: File-backed graph access and community detection.
    contents:
      - massive_weighted_graph
      - massive_csr_graph
      - massive_graph_modularity
      - massive_louvain_level
      - massive_leiden_refine_level
      - massive_leiden
      - massive_read_leiden_rows
      - massive_louvain
      - massive_read_louvain_rows
      - massive_walktrap
      - massive_read_walktrap_rows
      - massive_graph_partitions
      - massive_read_graph_partition
      - massive_cluster_landmarks
      - massive_cluster
      - massive_read_cluster_rows
  - title: Object Methods
    desc: Print and plot package result objects.
    contents:
      - plot.fastEmbedR_embedding
      - print.fastEmbedR_embedding
      - print.fastEmbedR_graph
      - print.fastEmbedR_graph_cluster
      - print.fastEmbedR_umap_initialization
